<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Course Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">StudentHub</div>

    <nav>
        <a href="#courses">Courses</a>
        <a href="#register">Register</a>
        <a href="#students">Students</a>
    </nav>
</header>

<section class="hero">

    <div>
        <h1>Learn Skills. Build Your Future.</h1>

        <p>
            Register for professional courses and start learning today.
        </p>

        <a href="#courses" class="button">
            Explore Courses
        </a>
    </div>

</section>

<section id="courses" class="container">

    <h2>Popular Courses</h2>

    <div id="courseList" class="courses"></div>

</section>

<section id="register" class="registration">

    <h2>Student Registration</h2>

    <form id="registrationForm">

        <input
            type="text"
            id="name"
            placeholder="Student Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required
        >

        <select id="course" required>

            <option value="">
                Select Course
            </option>

        </select>

        <button type="submit">
            Register Now
        </button>

    </form>

    <p id="message"></p>

</section>

<section id="students" class="container">

    <h2>Registered Students</h2>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
            </tr>

        </thead>

        <tbody id="studentList"></tbody>

    </table>

</section>

<script src="app.js"></script>

</body>
</html>
